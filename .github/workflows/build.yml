name: Build Executables

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows Executable via Spec
        run: |
          pyinstaller --noconfirm --clean Avionics.spec

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TargetLead-Windows
          path: dist/TargetLead_Windows.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxkbcommon-x11-0 \
            libegl1 \
            libopengl0 \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libasound2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux Executable via Spec
        run: |
          pyinstaller --noconfirm --clean Avionics.spec

      - name: Fix permissions and package tar.gz
        run: |
          chmod +x dist/TargetLead_Linux/TargetLead_Linux
          find dist/TargetLead_Linux -name "QtWebEngineProcess" -exec chmod +x {} +
          cd dist
          tar -czvf TargetLead_Linux.tar.gz TargetLead_Linux/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TargetLead-Linux
          path: dist/TargetLead_Linux.tar.gz