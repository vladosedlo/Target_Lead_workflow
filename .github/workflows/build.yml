name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller
        shell: bash

      - name: Detect entry point
        id: entry
        shell: bash
        run: |
          if [ -f main.py ]; then
            echo "entry=main.py" >> $GITHUB_OUTPUT
            echo "name=app" >> $GITHUB_OUTPUT
          elif [ -f app.py ]; then
            echo "entry=app.py" >> $GITHUB_OUTPUT
            echo "name=app" >> $GITHUB_OUTPUT
          else
            ENTRY=$(ls *.py | head -n 1)
            echo "entry=$ENTRY" >> $GITHUB_OUTPUT
            echo "name=${ENTRY%.py}" >> $GITHUB_OUTPUT
          fi

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller --onefile --noconsole --paths . --hidden-import "app" --hidden-import "main" --name "TargetLead_${{ runner.os }}" "${{ steps.entry.outputs.entry }}"

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: TargetLead_Linux
          path: dist/*

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: TargetLead_Windows
          path: dist/*
